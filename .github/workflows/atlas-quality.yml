name: Atlas quality
on:
  push:
    branches: [main, mejora-atlas-pedagogico]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Install isolated browser testing tools
        run: npm install --prefix /tmp/biosig-browser --package-lock=false playwright@1.58.2
      - run: node /tmp/biosig-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check learning journeys and responsive interface
        run: node scripts/check-atlas.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/biosig-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-previews
          path: artifacts/
